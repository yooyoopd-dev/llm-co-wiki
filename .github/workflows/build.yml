name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Windows is the only shipped target. macOS/Linux rows were removed
    # deliberately: nobody consumes those bundles and each one added ~20
    # minutes of queue time to every tag push.
    runs-on: windows-latest
    env:
      # GitHub-hosted runners occasionally hit crates.io HTTP/2 stream
      # resets while downloading large dependency graphs. Cargo retries plus
      # HTTP/1.1 transport make release builds less flaky.
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "5"
      CARGO_HTTP_TIMEOUT: "60"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The repo ships pre-downloaded PDFium binaries under
      # src-tauri/pdfium/ for every supported architecture; the Windows
      # build picks up pdfium.dll as-is, so no swap step is needed here.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Prepare MCP server resources
        run: |
          npm --prefix mcp-server ci
          npm run mcp:build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tag-triggered runs publish a real GitHub Release.
          # Manual (workflow_dispatch) runs leave tagName/releaseName
          # empty so tauri-action skips the release-upload step and
          # just produces bundle artifacts — useful for testing a
          # branch build without polluting the Releases page.
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && format('LLM-CO-WIKI {0}', github.ref_name) || '' }}
          releaseBody: 'See the assets below for download links.'
          releaseDraft: false
          prerelease: false

      - name: Package Windows portable zip
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          .github/scripts/package-windows-portable.ps1 -Version $version

      - name: Attach Windows portable zip to release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "${{ github.ref_name }}" dist-portable/*.zip --clobber

      # On workflow_dispatch, no release is created, so the bundles
      # would otherwise be discarded with the runner. Upload them as
      # workflow artifacts so the maintainer can `gh run download`
      # the .msi / .exe to test locally. Skipped on tag pushes since
      # the release page already has them.
      - name: Upload bundles as workflow artifacts (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-windows
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            dist-portable/*.zip
          if-no-files-found: warn
          retention-days: 14

  package-extension:
    name: Package browser extension
    needs: build
    # Browser extension is only published as part of an actual
    # tagged release; manual builds don't need it.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync extension manifest version and zip
        run: |
          # Pull version from package.json so we have a single source of
          # truth. Chrome's manifest requires numeric-only version
          # (e.g. 0.3.5), which matches the repo's semver convention.
          APP_VERSION=$(node -p "require('./package.json').version")
          node -e "
            const fs = require('fs');
            const p = 'extension/manifest.json';
            const m = JSON.parse(fs.readFileSync(p, 'utf-8'));
            m.version = '${APP_VERSION}';
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
          "
          mkdir -p dist-extension
          (cd extension && zip -r "../dist-extension/llm-wiki-extension-${APP_VERSION}.zip" . -x "*.DS_Store")
          ls -la dist-extension

      - name: Attach extension zip to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist-extension/*.zip --clobber

  prune-old-release-assets:
    name: Delete assets from older releases
    # Runs only after every upload for THIS tag has landed, so a failed
    # build never causes older downloads to be deleted while the new
    # release has nothing to offer.
    needs: [build, package-extension]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Delete assets attached to previous releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Refuse to delete anything unless this tag's own release actually
          # has downloads on it. `needs:` already orders this job last, but
          # the check is cheap and the operation is irreversible.
          current_assets=$(gh api "repos/${GH_REPO}/releases/tags/${CURRENT_TAG}" \
            --jq '.assets | length')
          echo "Release ${CURRENT_TAG} has ${current_assets} asset(s)."
          if [ "${current_assets}" -eq 0 ]; then
            echo "::error::Refusing to prune older releases while ${CURRENT_TAG} has no assets."
            exit 1
          fi

          # Releases themselves (and their notes/tags) are kept — only the
          # binary assets of older releases are removed, so the Releases
          # page stays a readable history while storage holds one build.
          gh api --paginate "repos/${GH_REPO}/releases" \
            --jq ".[] | select(.tag_name != \"${CURRENT_TAG}\") | .assets[] | [.id, .name] | @tsv" \
            > assets.tsv
          if [ ! -s assets.tsv ]; then
            echo "No assets on older releases; nothing to prune."
            exit 0
          fi
          while IFS=$'\t' read -r id name; do
            echo "Deleting asset ${name} (${id})"
            gh api -X DELETE "repos/${GH_REPO}/releases/assets/${id}"
          done < assets.tsv
