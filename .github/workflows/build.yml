name: Build & Release

# Releases are driven by the version in package.json, not by a pushed tag.
# Merging a version bump into main publishes that version; the tag is created
# server-side by `gh release create --target`, which needs nothing but the
# workflow's own GITHUB_TOKEN. A pushed `v*` tag still works for anyone who
# prefers that route.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    name: Decide whether to publish
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag and check whether it is already released
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A tag push names its own version; every other trigger takes the
          # version from package.json, which version-sync.test.ts already
          # holds equal to tauri.conf.json and Cargo.toml.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          # Without this guard every push to main would rebuild and then fail
          # trying to create a release that exists. Only a version that has no
          # release yet is worth ~45 minutes of Windows runner time.
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release ${tag} already exists — nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Release ${tag} does not exist yet — building."
          fi

  build:
    name: Build Windows bundles
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    # Windows is the only shipped target. macOS/Linux rows were removed
    # deliberately: nobody consumes those bundles and each one added ~20
    # minutes of queue time to every release.
    runs-on: windows-latest
    env:
      # GitHub-hosted runners occasionally hit crates.io HTTP/2 stream
      # resets while downloading large dependency graphs. Cargo retries plus
      # HTTP/1.1 transport make release builds less flaky.
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "5"
      CARGO_HTTP_TIMEOUT: "60"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The repo ships pre-downloaded PDFium binaries under
      # src-tauri/pdfium/; the Windows build picks up pdfium.dll as-is.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Prepare MCP server resources
        run: |
          npm --prefix mcp-server ci
          npm run mcp:build

      # tauri-action builds only. Publishing is done explicitly below so the
      # tag, the release and every upload go through one mechanism we can
      # reason about, instead of splitting it across the action's own
      # release handling.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows portable zip
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          .github/scripts/package-windows-portable.ps1 -Version $version

      # `gh release create` creates the git tag at --target when it does not
      # exist, so no tag has to be pushed from a developer machine.
      - name: Create the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LLM-CO-WIKI $TAG" \
            --notes "See the assets below for download links."

      - name: Attach Windows bundles to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            dist-portable/*.zip
          )
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::Build produced no installer or portable zip."
            exit 1
          fi
          printf 'Uploading %s\n' "${assets[@]}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"

  package-extension:
    name: Package browser extension
    needs: [gate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync extension manifest version and zip
        run: |
          # Pull version from package.json so we have a single source of
          # truth. Chrome's manifest requires numeric-only version
          # (e.g. 0.3.5), which matches the repo's semver convention.
          APP_VERSION=$(node -p "require('./package.json').version")
          node -e "
            const fs = require('fs');
            const p = 'extension/manifest.json';
            const m = JSON.parse(fs.readFileSync(p, 'utf-8'));
            m.version = '${APP_VERSION}';
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
          "
          mkdir -p dist-extension
          (cd extension && zip -r "../dist-extension/llm-wiki-extension-${APP_VERSION}.zip" . -x "*.DS_Store")
          ls -la dist-extension

      - name: Attach extension zip to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist-extension/*.zip

  prune-old-release-assets:
    name: Delete assets from older releases
    # Runs only after every upload for THIS tag has landed, so a failed
    # build never causes older downloads to be deleted while the new
    # release has nothing to offer.
    needs: [gate, build, package-extension]
    runs-on: ubuntu-latest
    steps:
      - name: Delete assets attached to previous releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT_TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail

          # Refuse to delete anything unless this tag's own release actually
          # has downloads on it. `needs:` already orders this job last, but
          # the check is cheap and the operation is irreversible.
          current_assets=$(gh api "repos/${GH_REPO}/releases/tags/${CURRENT_TAG}" \
            --jq '.assets | length')
          echo "Release ${CURRENT_TAG} has ${current_assets} asset(s)."
          if [ "${current_assets}" -eq 0 ]; then
            echo "::error::Refusing to prune older releases while ${CURRENT_TAG} has no assets."
            exit 1
          fi

          # Releases themselves (and their notes/tags) are kept — only the
          # binary assets of older releases are removed, so the Releases
          # page stays a readable history while storage holds one build.
          gh api --paginate "repos/${GH_REPO}/releases" \
            --jq ".[] | select(.tag_name != \"${CURRENT_TAG}\") | .assets[] | [.id, .name] | @tsv" \
            > assets.tsv
          if [ ! -s assets.tsv ]; then
            echo "No assets on older releases; nothing to prune."
            exit 0
          fi
          while IFS=$'\t' read -r id name; do
            echo "Deleting asset ${name} (${id})"
            gh api -X DELETE "repos/${GH_REPO}/releases/assets/${id}"
          done < assets.tsv
